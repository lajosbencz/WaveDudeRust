# Dependency updates (decision 0011): Cargo, the compiler of rust-toolchain.toml, the base of the Linux build image and
# the workflows' actions, which stay pinned to commit hashes (Dependabot moves the hash and its version comment).
# Security updates come on top, as soon as an advisory appears, once "Dependabot security updates" is on in the
# repository's settings. The prefixes matter to cliff.toml: chore(deps) counts towards a release (the dependencies, the
# compiler and the build image ship in the programs), ci(deps) does not.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    # A version is offered once it is a week old, past the days in which a compromised release is usually found and
    # yanked; security updates do not wait.
    cooldown:
      default-days: 7
    # One pull request for minor and patch updates (auto-merged), one for major ones (by hand, they may break the
    # build), one for security updates; an open one is updated in place. The schedule is per ecosystem, not per group.
    groups:
      cargo-minor:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Moves with epaint: waveduderust::view reads the glyph outlines with epaint's version.
      - dependency-name: skrifa
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"
  # Version updates only: Dependabot has no security updates for the toolchain. A minor bump auto-merges.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  # The base of .github/build/linux.Dockerfile: Dependabot moves its digest within the tag, a patch update that merges
  # once the required checks pass. AlmaLinux 9 would raise the glibc floor, so major versions are not offered; that
  # switch is by hand (decision 0011).
  - package-ecosystem: docker
    directory: /.github/build
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: almalinux
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
