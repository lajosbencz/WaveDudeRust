# Dependency updates (decision 0011): Cargo and the workflows' actions, which stay pinned to commit hashes
# (Dependabot moves the hash and its version comment). Security updates come on top, as soon as an advisory
# appears, once "Dependabot security updates" is on in the repository's settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
