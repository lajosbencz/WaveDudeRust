# Dependency updates (decision 0011): Cargo and the workflows' actions, which stay pinned to commit hashes
# (Dependabot moves the hash and its version comment). Security updates come on top, as soon as an advisory
# appears, once "Dependabot security updates" is on in the repository's settings. The prefixes matter to cliff.toml:
# chore(deps) counts towards a release (the dependencies ship in the programs), ci(deps) does not.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    # A version is offered once it is a week old, past the days in which a compromised release is usually found and
    # yanked; security updates do not wait.
    cooldown:
      default-days: 7
    # One pull request for minor and patch updates (auto-merged), one for major ones (by hand, they may break the
    # build), one for security updates; an open one is updated in place. The schedule is per ecosystem, not per group.
    groups:
      cargo-minor:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
