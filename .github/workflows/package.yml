# Builds and attests the packages and the browser app of one release; called by release.yml. A reusable workflow so the attestations name
# it as their signer (SLSA Build L3): `gh attestation verify --signer-workflow <owner>/<repo>/.github/workflows/package.yml`.
# No secrets, a read-only token and no cache: dependencies' build scripts run here (decision 0011).
name: Package

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        type: string
        required: true
      update-pubkey:
        description: The updater's public key; empty builds without the updater.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # `target`: the SBOM's; `update-platforms`: the updater's keys the package serves (`<os>-<arch>` as
        # cargo-packager-updater names the running program). The macOS bundle is universal: one build on the arm
        # runner for both architectures.
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, formats: appimage, update: appimage, update-platforms: linux-x86_64 }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, formats: nsis, update: nsis, update-platforms: windows-x86_64 }
          - { os: macos-15, platform: macos-universal, target: aarch64-apple-darwin, formats: "app,dmg", update: app, update-platforms: "macos-aarch64 macos-x86_64", universal: true }
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      WAVEDUDE_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      WAVEDUDE_UPDATE_PUBKEY: ${{ inputs.update-pubkey }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - if: matrix.universal
        run: rustup target add x86_64-apple-darwin
      - name: Bundled libraries
        if: runner.os == 'Linux'
        # The X11 client libraries winit loads at runtime, which the AppImage carries ([package.metadata.packager.appimage]).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxi6 libxrandr2
      - name: Tools
        run: cargo install --locked cargo-packager@0.11.8 cargo-auditable@0.7.7 cargo-cyclonedx@0.5.9
      # cargo auditable embeds the dependency list in the binaries (`cargo audit bin`).
      - name: Build
        if: '!matrix.universal'
        run: cargo auditable build --release -p wavedude-app -p wavedude-cli
      - name: Build universal
        if: matrix.universal
        run: |
          cargo auditable build --release -p wavedude-app -p wavedude-cli \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          for program in wavedude-app wavedude-cli; do
            lipo -create -output "target/universal-apple-darwin/release/$program" \
              "target/aarch64-apple-darwin/release/$program" "target/x86_64-apple-darwin/release/$program"
          done
      - name: Package
        run: |
          cargo packager --release -p wavedude-app --formats "${{ matrix.formats }}" \
            ${{ matrix.universal && '--target universal-apple-darwin' || '' }}
        env:
          # linuxdeploy's own strip: the system libraries come stripped, and our binaries keep their symbol names
          # for backtraces; its old strip also fails on newer distributions' libraries.
          NO_STRIP: "true"
          # linuxdeploy is an AppImage itself: extract instead of mounting, no FUSE on the runner needed.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          # a prefix tree with its own install.sh: menu entry, icons and file types beside the programs
          dir="wavedude-rust-$VERSION-${{ matrix.platform }}"
          assets=crates/wavedude-app/assets
          mkdir -p "$dir/bin" "$dir/share/applications" "$dir/share/mime/packages"
          cp target/release/wavedude-app target/release/wavedude-cli "$dir/bin"
          cp LICENSE.md NOTICE.md README.md "$assets/linux/install.sh" "$dir"
          cp "$assets/linux/wavedude-app.desktop" "$dir/share/applications"
          cp "$assets/linux/wavedude-rust.xml" "$dir/share/mime/packages"
          for png in "$assets"/icons/*x*.png; do
            install -D -m 644 "$png" "$dir/share/icons/hicolor/$(basename "$png" .png)/apps/wavedude-app.png"
          done
          tar -czf "target/packages/$dir.tar.gz" "$dir"
      - name: macOS update archive
        # The updater's format, which cargo-packager makes only while signing: the bundle under its own name.
        if: matrix.update == 'app'
        env:
          COPYFILE_DISABLE: "1"
        run: |
          app=$(find target/packages -maxdepth 1 -type d -name '*.app')
          tar -czf "$app.tar.gz" -C target/packages "$(basename "$app")"
      - name: Collect
        run: |
          mkdir dist
          find target/packages -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          # Asset names without spaces (URLs in latest.json) and unique per platform (both macOS builds share one name).
          for f in dist/*; do
            name=$(basename "$f" | tr ' ' '-')
            case "$name" in *${{ matrix.platform }}*) ;; *) name="${{ matrix.platform }}-$name" ;; esac
            [ "dist/$name" = "$f" ] || mv "$f" "dist/$name"
          done
          ls -l dist
      - name: SBOMs
        run: |
          cargo cyclonedx -q --manifest-path crates/wavedude-app/Cargo.toml -f json --spec-version 1.5 \
            --target "${{ matrix.target }}" --override-filename sbom
          mkdir sbom
          for program in wavedude-app wavedude-cli; do
            cp "crates/$program/sbom.json" "sbom/$program-$VERSION-${{ matrix.platform }}.cdx.json"
          done
      - name: Update entry
        if: inputs.update-pubkey != ''
        run: |
          case "${{ matrix.update }}" in
            appimage) bundle=$(ls dist/*.AppImage) ;;
            nsis) bundle=$(ls dist/*.exe) ;;
            app) bundle=$(ls dist/*.app.tar.gz) ;;
          esac
          name=$(basename "$bundle")
          mkdir update
          for platform in ${{ matrix.update-platforms }}; do
            jq -n --arg platform "$platform" --arg format "${{ matrix.update }}" --arg name "$name" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$name" \
              '{($platform): {url: $url, format: $format, name: $name}}' > "update/$platform.json"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-app-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-cli-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - name: Stage
        run: mv sbom/* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.update-pubkey != ''
        with:
          name: update-${{ matrix.platform }}
          path: update/*.json
          if-no-files-found: error

  # The browser app, which pages.yml deploys from the latest release.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Tools
        run: cargo install --locked cargo-cyclonedx@0.5.9
      # The CLI must match the wasm-bindgen crate of Cargo.lock; tools/build-web.sh checks it again.
      - name: wasm-bindgen version of Cargo.lock
        id: bindgen
        run: echo "version=$(tools/build-web.sh --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build
        run: |
          dir="wavedude-rust-$VERSION-web"
          tools/build-web.sh "$dir"
          mkdir dist
          tar -czf "dist/$dir.tar.gz" "$dir"
      - name: SBOM
        run: |
          mkdir sbom
          for crate in wavedude-app wavedude-run-worker; do
            cargo cyclonedx -q --manifest-path "crates/$crate/Cargo.toml" -f json --spec-version 1.5 \
              --target wasm32-unknown-unknown --override-filename sbom
            cp "crates/$crate/sbom.json" "sbom/$crate-$VERSION-web.cdx.json"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-app-${{ inputs.version }}-web.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-run-worker-${{ inputs.version }}-web.cdx.json
      - name: Stage
        run: mv sbom/* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error
