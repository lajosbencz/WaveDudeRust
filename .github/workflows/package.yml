# Builds and attests the packages of one release; called by release.yml. A reusable workflow so the attestations name
# it as their signer (SLSA Build L3): `gh attestation verify --signer-workflow <owner>/<repo>/.github/workflows/package.yml`.
# No secrets and a read-only token: dependencies' build scripts run here.
name: Package

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        type: string
        required: true
      update-pubkey:
        description: The updater's public key; empty builds without the updater.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_PACKAGES: libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev

jobs:
  package:
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, formats: appimage, update: appimage }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, formats: nsis, update: nsis }
          - { os: macos-15, platform: macos-aarch64, target: aarch64-apple-darwin, formats: "app,dmg", update: app }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin, formats: "app,dmg", update: app }
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      WAVEDUDE_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      WAVEDUDE_UPDATE_PUBKEY: ${{ inputs.update-pubkey }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Tools
        run: cargo install --locked cargo-packager@0.11.8 cargo-auditable@0.7.7 cargo-cyclonedx@0.5.9
      - name: Package
        # cargo auditable embeds the dependency list in the binaries (`cargo audit bin`); its rustc wrapper reaches
        # cargo-packager's own `cargo build` through the environment.
        run: cargo auditable packager --release -p wavedude-app --formats "${{ matrix.formats }}"
        env:
          # linuxdeploy's own strip: the system libraries come stripped, and our binaries keep their symbol names
          # for backtraces; its old strip also fails on newer distributions' libraries.
          NO_STRIP: "true"
          # linuxdeploy is an AppImage itself: extract instead of mounting, no FUSE on the runner needed.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          dir="wavedude-rust-$VERSION-${{ matrix.platform }}"
          mkdir "$dir"
          cp target/release/wavedude-app target/release/wavedude-cli LICENSE.md NOTICE.md README.md "$dir"
          tar -czf "target/packages/$dir.tar.gz" "$dir"
      - name: macOS update archive
        # The updater's format, which cargo-packager makes only while signing: the bundle under its own name.
        if: matrix.update == 'app'
        env:
          COPYFILE_DISABLE: "1"
        run: |
          app=$(find target/packages -maxdepth 1 -type d -name '*.app')
          tar -czf "$app.tar.gz" -C target/packages "$(basename "$app")"
      - name: Collect
        run: |
          mkdir dist
          find target/packages -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          # Asset names without spaces (URLs in latest.json) and unique per platform (both macOS builds share one name).
          for f in dist/*; do
            name=$(basename "$f" | tr ' ' '-')
            case "$name" in *${{ matrix.platform }}*) ;; *) name="${{ matrix.platform }}-$name" ;; esac
            [ "dist/$name" = "$f" ] || mv "$f" "dist/$name"
          done
          ls -l dist
      - name: SBOMs
        run: |
          cargo cyclonedx -q --manifest-path crates/wavedude-app/Cargo.toml -f json --spec-version 1.5 \
            --target "${{ matrix.target }}" --override-filename sbom
          mkdir sbom
          for program in wavedude-app wavedude-cli; do
            cp "crates/$program/sbom.json" "sbom/$program-$VERSION-${{ matrix.platform }}.cdx.json"
          done
      - name: Update entry
        if: inputs.update-pubkey != ''
        run: |
          case "${{ matrix.update }}" in
            appimage) bundle=$(ls dist/*.AppImage) ;;
            nsis) bundle=$(ls dist/*.exe) ;;
            app) bundle=$(ls dist/*.app.tar.gz) ;;
          esac
          name=$(basename "$bundle")
          mkdir update
          jq -n --arg platform "${{ matrix.platform }}" --arg format "${{ matrix.update }}" --arg name "$name" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$name" \
            '{($platform): {url: $url, format: $format, name: $name}}' > "update/${{ matrix.platform }}.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-app-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-cli-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - name: Stage
        run: mv sbom/* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.update-pubkey != ''
        with:
          name: update-${{ matrix.platform }}
          path: update/*.json
          if-no-files-found: error
