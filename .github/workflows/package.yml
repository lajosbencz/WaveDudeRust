# Builds and attests the packages and the browser app of one release; called by release.yml. A reusable workflow so the attestations name
# it as their signer (SLSA Build L3): `gh attestation verify --signer-workflow <owner>/<repo>/.github/workflows/package.yml`.
# No secrets, a read-only token and no cache: dependencies' build scripts run here (decision 0011).
name: Package

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        type: string
        required: true
      update-pubkey:
        description: The updater's public key; empty builds without the updater.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # `target`: the SBOM's; `update-platforms`: the updater's keys the package serves (`<os>-<arch>` as
        # cargo-packager-updater names the running program). The macOS bundle is universal: one build on the arm
        # runner for both architectures. `container`: the build runs in the container of that name, built from
        # .github/build/linux.Dockerfile for glibc 2.28 (decision 0011).
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, formats: appimage, update: appimage, update-platforms: linux-x86_64, container: wavedude-build }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, formats: nsis, update: nsis, update-platforms: windows-x86_64 }
          - { os: macos-15, platform: macos-universal, target: aarch64-apple-darwin, formats: "app,dmg", update: app, update-platforms: "macos-aarch64 macos-x86_64", universal: true }
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      SBOM_TARGET: ${{ matrix.target }}
      PACKAGE_FORMATS: ${{ matrix.formats }}
      UPDATE_FORMAT: ${{ matrix.update }}
      UPDATE_PLATFORMS: ${{ matrix.update-platforms }}
      CONTAINER: ${{ matrix.container }}
      WAVEDUDE_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      WAVEDUDE_UPDATE_PUBKEY: ${{ inputs.update-pubkey }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Prebuilt and checked against the action's checksums; no fallback to other sources. The Linux builds are
      # static (musl), so the container runs them as they are.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9
          fallback: none
      # The steps that run cargo run it in the container through `${CONTAINER:+docker exec "$CONTAINER"}`, as the
      # runner's user on the workspace, with the environment the build reads. NO_STRIP: no linuxdeploy strip; the
      # system libraries come stripped, and our binaries keep their symbol names for backtraces.
      # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy is an AppImage itself; extract instead of mounting, no FUSE needed.
      - name: Build container
        if: matrix.container
        run: |
          docker build -t "$CONTAINER" - < .github/build/linux.Dockerfile
          docker run -d --name "$CONTAINER" --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$(command -v cargo-auditable):/usr/local/bin/cargo-auditable:ro" \
            -v "$(command -v cargo-cyclonedx):/usr/local/bin/cargo-cyclonedx:ro" \
            -e CARGO_TERM_COLOR -e WAVEDUDE_UPDATE_ENDPOINT -e WAVEDUDE_UPDATE_PUBKEY \
            -e NO_STRIP=true -e APPIMAGE_EXTRACT_AND_RUN=1 \
            "$CONTAINER" sleep infinity
      - name: Toolchain
        run: ${CONTAINER:+docker exec "$CONTAINER"} rustup toolchain install
      - if: matrix.universal
        run: rustup target add x86_64-apple-darwin
      # No prebuilt release exists.
      - run: ${CONTAINER:+docker exec "$CONTAINER"} cargo install --locked cargo-packager@0.11.8
      # cargo auditable embeds the dependency list in the binaries (`cargo audit bin`).
      - name: Build
        if: '!matrix.universal'
        run: ${CONTAINER:+docker exec "$CONTAINER"} cargo auditable build --release -p wavedude-app -p wavedude-cli
      - name: Build universal
        if: matrix.universal
        run: |
          cargo auditable build --release -p wavedude-app -p wavedude-cli \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          for program in wavedude-app wavedude-cli; do
            lipo -create -output "target/universal-apple-darwin/release/$program" \
              "target/aarch64-apple-darwin/release/$program" "target/x86_64-apple-darwin/release/$program"
          done
      - name: Package
        run: |
          ${CONTAINER:+docker exec "$CONTAINER"} cargo packager --release -p wavedude-app --formats "$PACKAGE_FORMATS" \
            ${UNIVERSAL:+--target universal-apple-darwin}
        env:
          UNIVERSAL: ${{ matrix.universal }}
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          # a prefix tree with its own install.sh: menu entry, icons and file types beside the programs
          dir="wavedude-rust-$VERSION-$PACKAGE_PLATFORM"
          assets=crates/wavedude-app/assets
          mkdir -p "$dir/bin" "$dir/share/applications" "$dir/share/mime/packages"
          cp target/release/wavedude-app target/release/wavedude-cli "$dir/bin"
          cp LICENSE.md NOTICE.md README.md "$assets/linux/install.sh" "$dir"
          cp "$assets/linux/wavedude-app.desktop" "$dir/share/applications"
          cp "$assets/linux/wavedude-rust.xml" "$dir/share/mime/packages"
          for png in "$assets"/icons/*x*.png; do
            install -D -m 644 "$png" "$dir/share/icons/hicolor/$(basename "$png" .png)/apps/wavedude-app.png"
          done
          tar -czf "target/packages/$dir.tar.gz" "$dir"
      # The programs and every ELF file the AppImage carries need glibc 2.28 at most (decision 0011).
      - name: glibc floor
        if: matrix.container
        run: |
          docker exec "$CONTAINER" .github/build/glibc-floor.sh \
            target/release/wavedude-app target/release/wavedude-cli target/packages/*.AppImage
      - name: macOS update archive
        # The updater's format, which cargo-packager makes only while signing: the bundle under its own name.
        if: matrix.update == 'app'
        env:
          COPYFILE_DISABLE: "1"
        run: |
          app=$(find target/packages -maxdepth 1 -type d -name '*.app')
          tar -czf "$app.tar.gz" -C target/packages "$(basename "$app")"
      - name: Collect
        run: |
          mkdir dist
          find target/packages -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          # Asset names without spaces (URLs in latest.json) and unique per platform (both macOS builds share one name).
          for f in dist/*; do
            name=$(basename "$f" | tr ' ' '-')
            case "$name" in *"$PACKAGE_PLATFORM"*) ;; *) name="$PACKAGE_PLATFORM-$name" ;; esac
            [ "dist/$name" = "$f" ] || mv "$f" "dist/$name"
          done
          ls -l dist
      # The CLI of the tarball and of the AppImage starts on the build image's base, without its packages, and on
      # Debian 10, the oldest distribution at the floor; the window's program finds its libraries.
      - name: Smoke test
        if: matrix.container
        run: |
          appimage=$(realpath dist/*.AppImage)
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/smoke"
          (cd "$RUNNER_TEMP/smoke" && "$appimage" --appimage-extract > /dev/null)
          base=$(sed -n 's/^FROM //p' .github/build/linux.Dockerfile)
          for image in "$base" debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc; do
            docker run --rm -v "$RUNNER_TEMP/smoke:/smoke:ro" "$image" sh -ec '
              for cli in /smoke/wavedude-rust-*/bin/wavedude-cli /smoke/squashfs-root/usr/bin/wavedude-cli; do
                "$cli" --version
              done
              ! ldd /smoke/wavedude-rust-*/bin/wavedude-app | grep "not found"'
          done
      - name: SBOMs
        run: |
          ${CONTAINER:+docker exec "$CONTAINER"} cargo cyclonedx -q --manifest-path crates/wavedude-app/Cargo.toml \
            -f json --spec-version 1.5 --target "$SBOM_TARGET" --override-filename sbom
          mkdir sbom
          for program in wavedude-app wavedude-cli; do
            cp "crates/$program/sbom.json" "sbom/$program-$VERSION-$PACKAGE_PLATFORM.cdx.json"
          done
      - name: Update entry
        if: inputs.update-pubkey != ''
        run: |
          case "$UPDATE_FORMAT" in
            appimage) bundle=$(ls dist/*.AppImage) ;;
            nsis) bundle=$(ls dist/*.exe) ;;
            app) bundle=$(ls dist/*.app.tar.gz) ;;
          esac
          name=$(basename "$bundle")
          mkdir update
          for platform in $UPDATE_PLATFORMS; do
            jq -n --arg platform "$platform" --arg format "$UPDATE_FORMAT" --arg name "$name" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              '{($platform): {url: $url, format: $format, name: $name}}' > "update/$platform.json"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-app-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-cli-${{ inputs.version }}-${{ matrix.platform }}.cdx.json
      - name: Stage
        run: mv sbom/* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.update-pubkey != ''
        with:
          name: update-${{ matrix.platform }}
          path: update/*.json
          if-no-files-found: error

  # The browser app, which pages.yml deploys from the latest release.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      # WebAssembly/binaryen release (wasm-opt) with the digest of its x86_64-linux tarball.
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The CLI must match the wasm-bindgen crate of Cargo.lock; tools/build-web.sh checks it again.
      - name: wasm-bindgen version of Cargo.lock
        id: bindgen
        run: echo "version=$(tools/build-web.sh --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-cyclonedx@0.5.9,wasm-bindgen@${{ steps.bindgen.outputs.version }}
          fallback: none
      # wasm-opt of the browser build: a pinned release, checked against its published digest.
      - name: binaryen
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" -o binaryen.tar.gz
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          mkdir -p ~/binaryen
          tar -xzf binaryen.tar.gz --strip-components=1 -C ~/binaryen
          echo "$HOME/binaryen/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          dir="wavedude-rust-$VERSION-web"
          tools/build-web.sh "$dir"
          mkdir dist
          tar -czf "dist/$dir.tar.gz" "$dir"
      - name: SBOM
        run: |
          mkdir sbom
          for crate in wavedude-app wavedude-run-worker wavedude-spill-worker; do
            cargo cyclonedx -q --manifest-path "crates/$crate/Cargo.toml" -f json --spec-version 1.5 \
              --target wasm32-unknown-unknown --override-filename sbom
            cp "crates/$crate/sbom.json" "sbom/$crate-$VERSION-web.cdx.json"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-app-${{ inputs.version }}-web.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-run-worker-${{ inputs.version }}-web.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom/wavedude-spill-worker-${{ inputs.version }}-web.cdx.json
      - name: Stage
        run: mv sbom/* dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error
