name: CI

# Changes to files no step here reads skip the run: a pull request touching nothing else shows its checks
# pending, and an administrator merges it.
on:
  push:
    branches: [master, main]
    paths-ignore: &docs
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/package.yml"
      - ".github/workflows/hygiene.yml"
      - "cliff.toml"
      - "deny.toml"
      - "_typos.toml"
      - ".gitignore"
      - "tools/**"
      - "demo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A newer commit on the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # BtbN/FFmpeg-Builds release and asset (LGPL build) with the digest from its checksums.sha256.
  FFMPEG_RELEASE: autobuild-2026-11-09-12-42
  FFMPEG_BUILD: ffmpeg-N-128718-gb2b543c079-linux64-lgpl
  FFMPEG_SHA256: 728938551177f361c573d249ba70b0265db872d78c6389e1f1da52a41afb3379
  # File and line in backtraces, without the full debug info that slows linking (PDBs on Windows) and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, installed up front so the cache key sees it.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the default branch saves (pull requests restore its cache), so the 10 GB limit keeps the useful ones;
          # a failing test does not cost the next run its build.
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true
      - name: Linux packages for Skia and winit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev
      # The export tests decode what they wrote with ffmpeg (the programs never need it). A pinned static build,
      # checked against its published digest and cached; the distribution's package pulled in 128 others.
      - name: ffmpeg for the export tests
        if: runner.os == 'Linux'
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}
      - if: runner.os == 'Linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz" -o ffmpeg.tar.xz
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ~/ffmpeg "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
      - if: runner.os == 'Linux'
        run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features wavedude-export/openh264-source,wavedude-cli/openh264-source -- -D warnings
      - name: Test
        run: cargo test --workspace --features wavedude-export/openh264-source,wavedude-cli/openh264-source
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack@0.6.46,cargo-machete@0.9.2
      # Every feature combination of every crate compiles; checking is the proof, codegen and linking add nothing.
      - name: Feature checks
        if: runner.os == 'Linux'
        run: cargo hack check --workspace --feature-powerset --depth 2
      - name: Unused dependencies
        if: runner.os == 'Linux'
        run: cargo machete
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain at the workspace's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the default branch saves (pull requests restore its cache), so the 10 GB limit keeps the useful ones;
          # a failing test does not cost the next run its build.
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true
      - name: Linux packages for Skia and winit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets

  # The core without runs, with and without the GPU engine, and the wasm package stay buildable for the browser
  # (docs/decisions/0015-core-builds-for-wasm.md, docs/decisions/0016-gpu-engine-in-the-browser.md,
  # docs/decisions/0017-a-wasm-package-and-a-web-demo.md).
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy -p wavedude-core --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy with the GPU engine
        run: cargo clippy -p wavedude-core --no-default-features --features gpu --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the wasm package
        run: cargo clippy -p wavedude-wasm --target wasm32-unknown-unknown -- -D warnings

  # The caches of the default branch: one per key, the newest. rust-cache keys end in the lockfile's hash, so each
  # dependency bump would leave a generation behind until the 10 GB allowance evicts it.
  caches:
    name: Prune caches
    needs: [test, msrv, wasm32]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json id,key --jq '.[] | select(.key | startswith("v0-rust-")) | "\(.id)\t\(.key | sub("-[0-9a-f]+$"; ""))"' |
          awk -F '\t' 'seen[$2]++ { print $1 }' |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
