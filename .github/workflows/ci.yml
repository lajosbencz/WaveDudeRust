name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The release workflow starts CI on release-plz's PR this way: pull requests opened with GITHUB_TOKEN start no
  # workflow, a dispatch does.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info that slows linking (PDBs on Windows) and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the default branch saves (pull requests restore its cache), so the 10 GB limit keeps the useful ones;
          # a failing test does not cost the next run its build.
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true
      - name: Linux packages for Skia and winit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features wavedude-export/openh264-source,wavedude-cli/openh264-source -- -D warnings
      - name: Test
        run: cargo test --workspace --features wavedude-export/openh264-source,wavedude-cli/openh264-source
      - name: Feature builds
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace
          cargo build -p wavedude-export --no-default-features
          cargo build -p wavedude-core --no-default-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain at the workspace's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the default branch saves (pull requests restore its cache), so the 10 GB limit keeps the useful ones;
          # a failing test does not cost the next run its build.
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true
      - name: Linux packages for Skia and winit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets
