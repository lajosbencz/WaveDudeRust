name: CI

# Pull requests (and the release PR's dispatch from release.yml) run Linux; the merge queue runs every platform on the
# tree that lands, so master is never tested again. A push to master that changes what the caches are keyed on only
# compiles, saving the caches pull requests and the queue restore (they never save).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# A newer commit on the same pull request or branch cancels the run it supersedes; a queue entry's run never.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always
  # BtbN/FFmpeg-Builds release and asset (LGPL build) with the digest from its checksums.sha256.
  FFMPEG_RELEASE: autobuild-2026-11-09-12-42
  FFMPEG_BUILD: ffmpeg-N-128718-gb2b543c079-linux64-lgpl
  FFMPEG_SHA256: 728938551177f361c573d249ba70b0265db872d78c6389e1f1da52a41afb3379
  # File and line in backtraces, without the full debug info that slows linking (PDBs on Windows) and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Whether a pull request or queue entry touches anything a job here reads. A skipped job passes as a required check,
  # so a failure here runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DOCS: >-
            ^(docs/|[^/]+\.md$|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|dependabot\.yml$|workflows/(release|package|hygiene|pages|dependabot-automerge)\.yml$)|cliff\.toml$|deny\.toml$|_typos\.toml$|\.gitignore$|tools/(compare-csharp/|build-web\.sh$)|site/)
        # Both events check out a commit on top of its base: the merge of the pull request, the queue's squash.
        run: |
          code=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            git diff --name-only HEAD^1 HEAD | grep -qvE "$DOCS" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps: &test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, installed up front so the cache key sees it.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      # The export tests decode what they wrote with ffmpeg (the programs never need it). A pinned static build,
      # checked against its published digest and cached; the distribution's package pulled in 128 others.
      - name: ffmpeg for the export tests
        if: runner.os == 'Linux'
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}
      - if: runner.os == 'Linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz" -o ffmpeg.tar.xz
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ~/ffmpeg "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
      - if: runner.os == 'Linux'
        run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      # The GPU tests run on any adapter and skip without one; Mesa's software Vulkan driver gives the runner one.
      - name: Vulkan driver for the GPU tests
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Format
        if: github.event_name != 'push'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features wavedude-export/openh264-source,wavedude-cli/openh264-source -- -D warnings
      - name: Test
        run: >-
          cargo test --workspace --no-fail-fast --features wavedude-export/openh264-source,wavedude-cli/openh264-source
          ${{ github.event_name == 'push' && '--no-run' || '' }}
      - if: runner.os == 'Linux' && github.event_name != 'push'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack@0.6.46,cargo-machete@0.9.2
      # Every feature combination of every crate compiles; checking is the proof, codegen and linking add nothing.
      - name: Feature checks
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: cargo hack check --workspace --feature-powerset --depth 2
      - name: Unused dependencies
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: cargo machete
      - name: Docs
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Pull requests skip these (passing the required checks there); the queue runs them.
  windows:
    name: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && contains(fromJSON('["merge_group", "push"]'), github.event_name) }}
    runs-on: windows-latest
    steps: *test

  macos:
    name: macos-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && contains(fromJSON('["merge_group", "push"]'), github.event_name) }}
    runs-on: macos-latest
    steps: *test

  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain at the workspace's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets

  # The core with and without runs and the GPU engine, the view crate, the app state and the app stay buildable for
  # the browser, without std's clocks (docs/decisions/0015-core-builds-for-wasm.md,
  # docs/decisions/0016-gpu-engine-in-the-browser.md, tools/clippy-wasm32/clippy.toml).
  wasm32:
    name: wasm32
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: tools/clippy-wasm32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Clippy
        run: cargo clippy -p wavedude-core --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy with the GPU engine
        run: cargo clippy -p wavedude-core --no-default-features --features gpu --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy with runs
        run: cargo clippy -p wavedude-core --no-default-features --features run --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy with runs and the GPU engine
        run: cargo clippy -p wavedude-core --no-default-features --features run,gpu --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the view crate
        run: cargo clippy -p wavedude-view --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the app state
        run: cargo clippy -p wavedude-app-state --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the export crate
        run: cargo clippy -p wavedude-export --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the app
        run: cargo clippy -p wavedude-app --target wasm32-unknown-unknown -- -D warnings

  # The caches of the default branch: one per key, the newest. rust-cache keys end in the lockfile's hash, so each
  # dependency bump would leave a generation behind until the 10 GB allowance evicts it.
  caches:
    name: Prune caches
    needs: [ubuntu, windows, macos, msrv, wasm32]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json id,key --jq '.[] | select(.key | startswith("v0-rust-")) | "\(.id)\t\(.key | sub("-[0-9a-f]+$"; ""))"' |
          awk -F '\t' 'seen[$2]++ { print $1 }' |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
