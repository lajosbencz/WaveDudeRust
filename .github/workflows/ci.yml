name: CI

# Pull requests (and the release PR's dispatch from release.yml) run every platform; the ruleset requires them up to
# date with master, so the tree they tested is the one that lands and master is never tested again. A push to master
# that changes what the caches are keyed on only compiles, saving the caches pull requests restore (they never save).
# A merge queue (a `merge_group` trigger, checks on Linux alone for pull requests) needs an organization-owned
# repository; GitHub refuses the rule on a personal one.
on:
  pull_request:
  workflow_dispatch:
  # Auto-merged PRs land through GITHUB_TOKEN, which triggers no push run; this keeps master's caches current.
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [master]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# A newer commit on the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # BtbN/FFmpeg-Builds release and asset (LGPL build) with the digest from its checksums.sha256. A month's last
  # build: BtbN keeps those about two years, the daily ones about two weeks.
  FFMPEG_RELEASE: autobuild-2026-10-31-12-59
  FFMPEG_BUILD: ffmpeg-N-128227-g4811625b5f-linux64-lgpl
  FFMPEG_SHA256: f7ce163eca978dc3ab761e6c288f5f764ec4326d17c926c8d4f75ed95e77ee4b
  # WebAssembly/binaryen release (wasm-opt) with the digest of its x86_64-linux tarball.
  BINARYEN_VERSION: "133"
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  # File and line in backtraces, without the full debug info that slows linking (PDBs on Windows) and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Whether a pull request touches anything a job here reads; a skipped job passes `result`. A failure here runs
  # everything and fails `result`.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DOCS: >-
            ^(docs/|[^/]+\.md$|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|dependabot\.yml$|zizmor\.yml$|workflows/(release|package|hygiene|pages|pins|dependabot-automerge)\.yml$)|cliff\.toml$|deny\.toml$|_typos\.toml$|\.gitignore$|tools/compare-csharp/|site/|sgconfig\.yml$|lints/|\.editorconfig$)
        # A pull request checks out its merge into the base.
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | grep -qvE "$DOCS" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, installed up front so the cache key sees it.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The export tests decode what they wrote with ffmpeg (the programs never need it). A pinned static build,
      # checked against its published digest and cached; the distribution's package pulled in 128 others.
      - name: ffmpeg for the export tests
        if: runner.os == 'Linux'
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}
      - if: runner.os == 'Linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz" -o ffmpeg.tar.xz
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ~/ffmpeg "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
      - if: runner.os == 'Linux'
        run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      # The GPU tests run on any adapter and skip without one; Mesa's software Vulkan driver gives the runner one.
      - name: Vulkan driver for the GPU tests
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      # The checks are the justfile's recipes; the tool pins are its variables.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
          fallback: none
      - id: pins
        shell: bash
        run: |
          {
            echo "nextest=$(just --evaluate nextest_version)"
            echo "hack=$(just --evaluate hack_version)"
            echo "shear=$(just --evaluate shear_version)"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.nextest }}
          fallback: none
      - name: Format
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: just fmt
      - name: Clippy
        run: just clippy-native
      - name: Test
        # bash on Windows too, for the parameter expansion
        shell: bash
        run: just test --profile ci --no-fail-fast ${NO_RUN:+--no-run}
        env:
          NO_RUN: ${{ github.event_name == 'push' && 'true' || '' }}
      # nextest runs no doctests.
      - name: Doctests
        if: github.event_name != 'push'
        run: just doctest
      - if: runner.os == 'Linux' && github.event_name != 'push'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack@${{ steps.pins.outputs.hack }},cargo-shear@${{ steps.pins.outputs.shear }}
          fallback: none
      # Every feature pair of every crate compiles; checking is the proof, codegen and linking add nothing.
      - name: Feature checks
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: just features
      - name: Unused dependencies
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: just shear
      - name: Docs
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: just doc
      # No headless crate reaches a UI toolkit, MAJOR.MINOR aligned, toolchain == MSRV, subsecond off the default graph.
      - name: Guards
        if: runner.os == 'Linux' && github.event_name != 'push'
        run: just layers versions-check hotpatch-guard

  windows:
    name: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *test

  macos:
    name: macos-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps: *test

  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain at the workspace's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets

  # The browser crates (the justfile's wasm_crates) stay buildable for the browser, without std's clocks
  # (docs/decisions/0015-core-builds-for-wasm.md, docs/decisions/0016-gpu-engine-in-the-browser.md,
  # tools/clippy-wasm32/clippy.toml), and the browser app builds as package.yml builds it.
  wasm32:
    name: wasm32
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
          fallback: none
      - id: pins
        run: echo "hack=$(just --evaluate hack_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack@${{ steps.pins.outputs.hack }}
          fallback: none
      # Each feature alone, the default set and none, per browser crate.
      - name: Clippy
        run: just clippy-wasm
      # The CLI must match the wasm-bindgen crate of Cargo.lock; tools/build-web.sh checks it again.
      - name: wasm-bindgen version of Cargo.lock
        id: bindgen
        run: echo "version=$(tools/build-web.sh --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
          fallback: none
      # wasm-opt of the browser build: a pinned release, checked against its published digest.
      - name: binaryen
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" -o binaryen.tar.gz
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          mkdir -p ~/binaryen
          tar -xzf binaryen.tar.gz --strip-components=1 -C ~/binaryen
          echo "$HOME/binaryen/bin" >> "$GITHUB_PATH"
      - name: Browser app
        run: tools/build-web.sh

  # The Linux release build in its container (.github/build/linux.Dockerfile, decision 0011), without packaging: the
  # programs build there, need glibc 2.28 at most and start on the image's base without its packages.
  glibc:
    name: glibc
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On the runner for the cache key only; the container installs its own.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # As the runner's user on the workspace, with the cached registry: rust-cache saves what the build wrote.
      - name: Build container
        run: |
          docker build -t build - < .github/build/linux.Dockerfile
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run -d --name build --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -e CARGO_TERM_COLOR build sleep infinity
          docker exec build rustup toolchain install
      - name: Build
        run: docker exec build cargo build --release -p waveduderust_classic -p waveduderust_cli
      # Then the check itself: below every version the CLI needs, it has to fail.
      - name: glibc floor
        run: |
          docker exec build .github/build/glibc-floor.sh target/release/waveduderust target/release/waveduderust-cli
          if docker exec -e GLIBC_FLOOR=2.0 build .github/build/glibc-floor.sh target/release/waveduderust-cli 2> /dev/null; then
            echo "::error::glibc-floor.sh passed with a floor below every version"
            exit 1
          fi
      - name: Smoke test
        run: |
          base=$(sed -n 's/^FROM //p' .github/build/linux.Dockerfile)
          docker run --rm -v "$GITHUB_WORKSPACE/target/release:/release:ro" "$base" \
            sh -ec '/release/waveduderust-cli --version; ! ldd /release/waveduderust | grep "not found"'

  # The one required check: a skipped job passes, a failed or cancelled one fails.
  result:
    name: CI result
    needs: [changes, ubuntu, windows, macos, msrv, wasm32, glibc]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The caches of the default branch: one per key, the newest. rust-cache keys end in the lockfile's hash, so each
  # dependency bump would leave a generation behind until the 10 GB allowance evicts it.
  caches:
    name: Prune caches
    needs: [ubuntu, windows, macos, msrv, wasm32, glibc]
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json id,key --jq '.[] | select(.key | startswith("v0-rust-")) | "\(.id)\t\(.key | sub("-[0-9a-f]+$"; ""))"' |
          awk -F '\t' 'seen[$2]++ { print $1 }' |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
