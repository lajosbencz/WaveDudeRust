# Dependabot's patch and minor updates, security ones included, merge on their own once the required checks pass
# (decision 0011); major ones wait for a person. Needs "Allow auto-merge"; the merge queue merges them.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        # fetch-metadata calls 0.9 -> 0.10 a minor update; Cargo, and Dependabot's cargo-major group, a breaking one.
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.dependency-group != 'cargo-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
