# Dependabot's patch and minor updates, security ones included, merge on their own once the required checks pass
# (decision 0011); major ones, and those fetch-metadata cannot classify, wait for a person. Needs "Allow auto-merge"
# and the ruleset's required checks.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        # update-type: the highest of a grouped pull request's dependencies, empty when unknown (fetch-metadata's
        # src/dependabot/output.ts, maxSemver).
        # fetch-metadata calls 0.9 -> 0.10 a minor update; Cargo, and Dependabot's cargo-major group, a breaking one.
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          steps.meta.outputs.dependency-group != 'cargo-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
