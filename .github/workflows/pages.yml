# Deploys site/ to GitHub Pages with the latest release's browser app under app/: from every master commit that
# changes the site, after each release (release.yml dispatches it), or by hand.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one finishes, a newer pending one replaces the older.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bundle package.yml built and attested for the latest release.
      - name: Browser app of the latest release
        run: |
          repo="$GITHUB_REPOSITORY"
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$repo" --pattern '*-web.tar.gz' --dir "$RUNNER_TEMP/web"
          bundle=$(ls "$RUNNER_TEMP"/web/*-web.tar.gz)
          gh attestation verify "$bundle" --repo "$repo" --signer-workflow "$repo/.github/workflows/package.yml"
          mkdir -p _site/app
          tar -xzf "$bundle" -C _site/app --strip-components=1
          echo "deploying the browser app of $tag"
      - name: Site
        run: cp site/index.html crates/wavedude-app/assets/icon.svg _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
