# Builds the web demo and deploys it to GitHub Pages; called by release.yml after a release is published, or run by hand
# (decision 0017). No cache: the output runs in visitors' browsers.
name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The CLI must match the wasm-bindgen crate of Cargo.lock; demo/build.sh checks it again.
      - name: wasm-bindgen version of Cargo.lock
        id: bindgen
        run: |
          echo "version=$(demo/build.sh --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build the site
        run: demo/build.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
