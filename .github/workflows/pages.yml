# Deploys site/ to GitHub Pages with the browser app under app/ from every master commit that changes either, or by
# hand. No cache: the output runs in visitors' browsers.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "site/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "tools/build-web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one finishes, a newer pending one replaces the older.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The CLI must match the wasm-bindgen crate of Cargo.lock; tools/build-web.sh checks it again.
      - name: wasm-bindgen version of Cargo.lock
        id: bindgen
        run: echo "version=$(tools/build-web.sh --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build the site
        run: |
          tools/build-web.sh _site/app
          cp site/index.html crates/wavedude-app/assets/icon.svg _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
