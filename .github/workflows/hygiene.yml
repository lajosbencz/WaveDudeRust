name: Hygiene

# Spelling, the dependency policy and the workflows' lint: seconds, no build, so every change runs them, docs
# included, and master pushes for the docs administrators push directly.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories, licences, wildcards and sources per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # `just lint` locally: the ast-grep rules of lints/rules and their tests.
  rules:
    name: Structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      # Not in install-action: checked against its published digest.
      - name: ast-grep
        run: |
          curl -sSfL "https://github.com/ast-grep/ast-grep/releases/download/$(just --evaluate ast_grep_version)/app-x86_64-unknown-linux-gnu.zip" \
            -o "$RUNNER_TEMP/ast-grep.zip"
          echo "$(just --evaluate ast_grep_sha256)  $RUNNER_TEMP/ast-grep.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          PATH="$RUNNER_TEMP/ast-grep:$PATH" just lint

  # actionlint: syntax, expressions, and shellcheck on the run scripts; zizmor: security, exceptions in
  # .github/zizmor.yml.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt and checked against the action's checksums; no fallback to other sources. Unversioned: the newest
      # in the manifest of the action's commit, so the action's update moves them.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: shellcheck,zizmor
          fallback: none
      # install-action has no actionlint: its release, checked against the published digest.
      - name: actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      # The online audits (impostor commits, known-vulnerable actions) read the API with the token.
      - name: zizmor
        run: zizmor .github
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required check: a failed or cancelled job fails it.
  result:
    name: Hygiene result
    needs: [typos, deny, rules, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
