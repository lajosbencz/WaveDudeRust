# Releases (decision 0011, docs/release.md). Opt-in per repository: set the variable RELEASE_ENABLED to "true".
# A push to the default branch either releases or prepares the next release:
# - the workspace version has no tag v<version> yet (a release pull request was merged): `release` tags the commit and
#   drafts the release, package.yml builds and attests the packages without secrets, `sign` signs the update bundles
#   without compiling anything, and `publish` attaches everything with latest.json and SHA256SUMS and publishes the
#   release, which is immutable from then on;
# - otherwise `release-pr` computes the next version, CHANGELOG.md and the notes with git-cliff (cliff.toml) from the
#   commits since the last tag, read-only, and `release-pr-push` keeps one pull request "chore(release): v<next>"
#   open, rebuilt as a single commit on the branch release-pr.
name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_BRANCH: release-pr

jobs:
  plan:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tagged: ${{ steps.plan.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no workspace version in Cargo.toml: '$version'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then tagged=true; else tagged=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "v$version tagged: $tagged"

  release-pr:
    needs: plan
    if: needs.plan.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: git-cliff@2.14.2
      - id: next
        run: |
          if [ "$(git cliff --unreleased --context | jq '[.[].commits[]] | length')" = 0 ]; then
            echo "Nothing to release since the last tag."
            exit 0
          fi
          version=$(git cliff --bumped-version)
          version=${version#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad next version '$version'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::the next version v$version is tagged already"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release files
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = "[^"]*"/version = "'"$VERSION"'"/' Cargo.toml
          # Internal dependencies that name a version (crates.io needs one).
          sed -i -E 's/^(wavedude-[a-z-]+ = \{ path = "[^"]+", version = ")[^"]*"/\1'"$VERSION"'"/' crates/*/Cargo.toml
          cargo update --workspace
          git cliff --tag "v$VERSION" -o CHANGELOG.md
          out="$RUNNER_TEMP/release-pr"
          mkdir "$out"
          # The release's section without its heading: the pull request's body.
          git cliff --unreleased --tag "v$VERSION" --strip all | tail -n +2 > "$out/notes.md"
          git diff --binary > "$out/release.patch"
          test -s "$out/release.patch"
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.next.outputs.version != ''
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr
          if-no-files-found: error

  # Write access, but no repository code runs here: the patch is applied, checked and pushed.
  release-pr-push:
    needs: release-pr
    if: needs.release-pr.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.release-pr.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr
      - name: Release commit
        run: |
          git apply "$RUNNER_TEMP/release-pr/release.patch"
          unexpected=$(git diff --name-only | grep -Ev '^(CHANGELOG\.md|Cargo\.lock|Cargo\.toml|crates/[^/]+/Cargo\.toml)$' || true)
          [ -z "$unexpected" ] || { echo "::error::the release patch touches $unexpected"; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -a -m "chore(release): v$VERSION"
      - name: Pull request
        run: |
          if [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME moved on; the newer push's run prepares the release."
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"
          {
            echo "Release v$VERSION. Rebuilt as one commit from $GITHUB_REF_NAME on every push; merging it (squash) tags"
            echo "the commit and starts the build. CHANGELOG.md is generated, edits to it here are overwritten."
            echo
            cat "$RUNNER_TEMP/release-pr/notes.md"
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$RELEASE_BRANCH" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$RELEASE_BRANCH" --base "$GITHUB_REF_NAME" --title "chore(release): v$VERSION" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        # Idempotent, so a failed run can be rerun.
        run: |
          tag="v$VERSION"
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "See CHANGELOG.md." > notes.md
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2> /dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag" --notes-file notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      update-pubkey: ${{ vars.UPDATER_PUBKEY }}

  # The signer, built apart from the key: its build scripts never share a runner with it.
  signer:
    needs: release
    if: needs.release.outputs.tag != '' && vars.UPDATER_PUBKEY != ''
    runs-on: ubuntu-latest
    steps:
      - run: cargo install --locked cargo-packager@0.11.8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signer
          path: ~/.cargo/bin/cargo-packager
          if-no-files-found: error

  # The only job holding the updater's private key, which only the signing step sees; the environment admits the
  # default branch alone.
  sign:
    needs: [package, signer]
    if: vars.UPDATER_PUBKEY != ''
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signer
          path: ${{ runner.temp }}/signer
      - run: chmod +x "$RUNNER_TEMP/signer/cargo-packager" && echo "$RUNNER_TEMP/signer" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-*
          merge-multiple: true
          path: update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir sig
          for name in $(jq -r '.[].name' update/*.json | sort -u); do
            cargo packager signer sign "dist/$name"
            mv "dist/$name.sig" sig/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: sig/*.sig
          if-no-files-found: error

  publish:
    needs: [release, package, sign]
    # Unsigned only when there is no updater key; a skipped sign with one means a failed signer.
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.sign.result == 'success' || (vars.UPDATER_PUBKEY == '' && needs.sign.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.UPDATER_PUBKEY != ''
        with:
          pattern: update-*
          merge-multiple: true
          path: update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.UPDATER_PUBKEY != ''
        with:
          name: signatures
          path: dist
      - name: latest.json
        if: vars.UPDATER_PUBKEY != ''
        run: |
          for entry in update/*.json; do
            name=$(jq -r '.[].name' "$entry")
            jq --rawfile signature "dist/$name.sig" 'map_values({url, format, signature: $signature})' "$entry"
          done | jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: add}' > dist/latest.json
      - name: SHA256SUMS
        run: (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/ && cat dist/SHA256SUMS
      # The packages carry package.yml's attestations; these cover what this job adds.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Upload
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
      # Every file is verified against its attestation before the release goes public, and the notes get the result:
      # the file, its digest and the workflow that made it. A file without one from this repository's build or
      # publish workflow stops the release.
      - name: Provenance of every file, into the notes
        run: |
          repo="$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$repo" --json body --jq .body > notes.md
          {
            echo
            echo "### Provenance"
            echo
            echo "Every file was built and published by this repository's GitHub Actions from commit"
            echo "[\`${GITHUB_SHA:0:12}\`](https://github.com/$repo/commit/$GITHUB_SHA), checked against its"
            echo "[attestation](https://github.com/$repo/attestations) before this release was published. To check a download:"
            echo
            echo '```sh'
            echo "gh release verify-asset $TAG <file> --repo $repo   # the file this release published (GitHub's attestation)"
            echo "gh attestation verify <file> --repo $repo         # built by this repository's workflow at the commit above"
            echo '```'
            echo
            echo "| File | SHA-256 | Made by |"
            echo "|---|---|---|"
          } >> notes.md
          for file in dist/*; do
            name=$(basename "$file")
            gh attestation verify "$file" --repo "$repo" --format json > verified.json
            # The build workflow's attestation names the maker; the publish job's covers what it added.
            workflow=$(jq -r --arg prefix "https://github.com/$repo/.github/workflows/" '
              [.[].verificationResult.signature.certificate.buildSignerURI
                | select(startswith($prefix)) | ltrimstr($prefix) | split("@")[0]]
              | if index("package.yml") then "package.yml" elif index("release.yml") then "release.yml" else "" end' \
              verified.json)
            if [ -z "$workflow" ]; then
              echo "::error::$name has no attestation from this repository's build or publish workflow"
              exit 1
            fi
            digest=$(sha256sum "$file" | cut -c1-64)
            echo "| $name | \`$digest\` | \`$workflow\` |" >> notes.md
          done
          gh release edit "$TAG" --repo "$repo" --notes-file notes.md
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
