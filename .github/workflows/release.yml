# Releases (decision 0011, docs/release.md). Opt-in per repository: set the variable RELEASE_ENABLED to "true".
# release-plz keeps a release PR open from the conventional commits on the default branch; merging it makes the
# draft GitHub release v<version> (and publishes the crates release-plz.toml lets it). package.yml builds and attests
# the packages without secrets, `sign` signs the update bundles without compiling anything, and `publish` attaches
# everything with latest.json and SHA256SUMS before it publishes the release, which is immutable from then on.
name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing, once publishing is on (docs/release.md).
      id-token: write
    outputs:
      tag: ${{ steps.app.outputs.tag }}
      version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for a crate's first crates.io publish; later ones go through trusted publishing (id-token).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: app
        env:
          RELEASES: ${{ steps.plz.outputs.releases }}
        run: |
          app=$(jq -c '.[] | select(.package_name == "wavedude-app")' <<< "${RELEASES:-[]}")
          echo "tag=$(jq -r '.tag // empty' <<< "$app")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' <<< "$app")" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      update-pubkey: ${{ vars.UPDATER_PUBKEY }}

  # The only job holding the updater's private key, which only the signing step sees.
  sign:
    needs: package
    if: vars.UPDATER_PUBKEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: cargo-packager
        run: cargo install --locked cargo-packager@0.11.8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-*
          merge-multiple: true
          path: update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir sig
          for name in $(jq -r '.[].name' update/*.json); do
            cargo packager signer sign "dist/$name"
            mv "dist/$name.sig" sig/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: sig/*.sig
          if-no-files-found: error

  publish:
    needs: [release, package, sign]
    if: ${{ !cancelled() && needs.package.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.sign.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.UPDATER_PUBKEY != ''
        with:
          pattern: update-*
          merge-multiple: true
          path: update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.UPDATER_PUBKEY != ''
        with:
          name: signatures
          path: dist
      - name: latest.json
        if: vars.UPDATER_PUBKEY != ''
        run: |
          for entry in update/*.json; do
            name=$(jq -r '.[].name' "$entry")
            jq --rawfile signature "dist/$name.sig" 'map_values({url, format, signature: $signature})' "$entry"
          done | jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: add}' > dist/latest.json
      - name: SHA256SUMS
        run: (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/ && cat dist/SHA256SUMS
      # The packages carry package.yml's attestations; these cover what this job adds.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Upload
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
