# web-sys's Web Locks bindings (navigator.locks) are behind its unstable cfg. simd128 lets the CPU engine's row
# loops vectorise in the browser (128-bit SIMD: Chrome 91, Firefox 89, Safari 16.4); docs/measurements.md, The
# browser's CPU engine.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis", "-C", "target-feature=+simd128"]
