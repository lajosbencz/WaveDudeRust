[package]
name = "waveduderust_macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Derives of the model's typed fields (Fields) and enum members (Word)"
publish = true
readme = "README.md"
documentation = "https://docs.rs/waveduderust_macros"
keywords = ["waveduderust", "derive"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
