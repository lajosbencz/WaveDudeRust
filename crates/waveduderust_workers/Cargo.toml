[package]
name = "waveduderust_workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude Rust's browser workers: the live run's engine beside the page, and the frames past memory in a dedicated worker's files"

[lints]
workspace = true

# The workers run in the browser alone; natively each binary says so and exits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The queue kicks' gaps (setTimeout, bound as a global so it works in a worker).
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
postcard.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
waveduderust_app = { path = "../waveduderust_app" }
waveduderust = { path = "../waveduderust", default-features = false, features = ["unstable-engine", "unstable-run", "gpu", "run"] }
web-sys = { workspace = true, features = [
	"DedicatedWorkerGlobalScope",
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetFileOptions",
	"FileSystemReadWriteOptions",
	"FileSystemSyncAccessHandle",
	"MessageChannel",
	"MessageEvent",
	"MessagePort",
	"StorageEstimate",
	"StorageManager",
	"WorkerNavigator",
] }
