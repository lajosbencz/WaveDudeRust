[package]
name = "waveduderust_workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude Rust's browser workers: the live run's engine beside the page"

[lints]
workspace = true

# The workers run in the browser alone; natively each binary says so and exits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
waveduderust = { path = "../waveduderust", default-features = false, features = ["run", "unstable-run"] }
waveduderust_remote = { path = "../waveduderust_remote" }
web-time.workspace = true
web-sys = { workspace = true, features = ["MessageChannel", "MessageEvent", "MessagePort"] }
