[package]
name = "waveduderust_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Headless checks, benches and scripted exports"

[features]
default = ["mp4"]
mp4 = ["waveduderust/mp4"]
# OpenH264 compiled in instead of Cisco's downloaded binary: for development and tests, not for distributed builds.
openh264-source = ["mp4", "waveduderust/openh264-source"]

[[bin]]
name = "waveduderust-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc = "3.4"
png.workspace = true
tracing-subscriber = { workspace = true, features = ["smallvec", "fmt", "ansi", "tracing-log", "std"] }
waveduderust = { path = "../waveduderust", default-features = false, features = ["unstable-engine", "unstable-scene", "unstable-run", "unstable-export", "gpu", "run", "export", "clap"] }
waveduderust_platform = { path = "../waveduderust_platform" }

[dev-dependencies]
tempfile.workspace = true
