[package]
name = "waveduderust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["wave", "simulation", "physics", "optics"]
categories = ["science", "simulation"]
description = "2D wave simulation: model, file formats, scene painter, CPU and wgpu engines, runs, renderer, overlays, exports"
publish = true
readme = "README.md"
documentation = "https://docs.rs/waveduderust"

[package.metadata.docs.rs]
features = ["serde", "clap", "unstable-engine", "unstable-scene", "unstable-run", "unstable-export", "unstable-view", "unstable-reflect"]

[features]
default = ["gpu", "run", "export", "mp4"]
gpu = ["dep:wgpu", "dep:pollster"]
# Runs and the frame store. Natively a threaded or pumped worker, a disk spill and the machine's memory; on wasm32 a
# pumped worker and a store in memory.
run = ["dep:sysinfo"]
# Serde for a run's goal and the project it carries, and the H.264 profile; a scene's image bytes are left out.
serde = ["dep:serde"]
# What the preview and the exports draw over a picture, as epaint shapes.
view = ["dep:epaint", "dep:libm", "dep:skrifa"]
# Image, video, OpenEXR and CSV export.
export = ["run", "view", "dep:png", "dep:jpeg-encoder", "dep:exr", "dep:rawzip"]
# The MP4 muxer alone, the H.264 encoder supplied by the caller: builds for the browser.
mp4-mux = ["export", "dep:shiguredo_mp4"]
# MP4 through Cisco's prebuilt OpenH264, loaded at run time (decision 0005); the program downloads it.
mp4 = ["mp4-mux", "dep:openh264", "openh264/libloading"]
# OpenH264 compiled into the program instead: for development and tests, not for distributed builds.
openh264-source = ["mp4", "openh264/source"]
# The export formats as command-line values.
clap = ["export", "dep:clap"]
# The internals under `waveduderust::unstable`, for first-party frontends: they may break in any release and the
# API diff skips them.
unstable-engine = []
unstable-scene = []
unstable-run = ["run"]
unstable-export = ["export", "unstable-engine", "unstable-run", "unstable-view"]
unstable-view = ["view", "unstable-engine"]
# The model's field reflection (`model::fields`, each type's `Field` and `Edit` enums and accessors).
unstable-reflect = []

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
waveduderust_macros = { path = "../waveduderust_macros", version = "0.4.3" }
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
derive_setters = "0.1"
serde_json.workspace = true
quick-xml = "0.42"
tracing.workspace = true
image = { workspace = true, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
json5 = "1.3"
base64 = "0.23"
num-complex = { version = "0.4", default-features = false, features = ["std"] }
web-time.workspace = true
wgpu = { workspace = true, optional = true }
# The shapes, text layout and fonts the preview and the exports draw with; egui's painting layer without egui.
epaint = { version = "=0.37.0", default-features = false, optional = true }
# The graphs' and handles' logarithms, powers and trig in Rust, so an export's pixels do not depend on the
# platform's maths library.
libm = { version = "0.2", optional = true }
# The glyph outlines a label's halo strokes: epaint's own font reader, so the outlines are those it rasterises.
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }
png = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
jpeg-encoder = { version = "0.7", optional = true }
exr = { version = "1.74", optional = true }
openh264 = { version = "0.9", default-features = false, optional = true }
rawzip = { version = "0.5", optional = true }
shiguredo_mp4 = { version = "=2026.5.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true, optional = true }
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"], optional = true }
# Saves write beside and rename over (`io::write_atomic`).
tempfile.workspace = true

[dev-dependencies]
# The integration tests read the internals.
waveduderust = { path = ".", features = ["unstable-engine", "unstable-scene", "unstable-export", "unstable-view", "unstable-reflect"] }
insta.workspace = true
proptest = "1"
postcard.workspace = true
tempfile.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
zip = { version = "9", default-features = false }
