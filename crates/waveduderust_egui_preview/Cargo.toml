[package]
name = "waveduderust_egui_preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude egui parts that draw the simulation: pictures, handle overlay, graph boxes, timeline, gradient editor and drawn icons"

[lints]
workspace = true

[dependencies]
# egui and the wgpu renderer the pictures are coloured on.
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu"] }
tracing.workspace = true
kurbo = "0.13"
waveduderust_app = { path = "../waveduderust_app" }
waveduderust_egui_platform = { path = "../waveduderust_egui_platform" }
waveduderust = { path = "../waveduderust", default-features = false, features = ["unstable-engine", "unstable-reflect", "unstable-view", "gpu", "run", "view"] }
