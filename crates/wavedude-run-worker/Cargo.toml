[package]
name = "wavedude-run-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude's live run in the browser: the engines in a module worker beside the page"

[lints]
workspace = true

# The worker runs in the browser alone; natively the binary says so and exits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The queue kicks' gaps (setTimeout, bound as a global so it works in a worker).
gloo-timers = { version = "0.4", features = ["futures"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
wavedude-app-state = { path = "../wavedude-app-state" }
wavedude-core = { path = "../wavedude-core", features = ["gpu"] }
web-sys = { workspace = true, features = ["MessageChannel", "MessageEvent", "MessagePort"] }
