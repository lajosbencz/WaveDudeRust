[package]
name = "wavedude-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The WaveDude engine for the browser: open a project, step to a frame, draw its layers and overlays"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
wavedude-core = { path = "../wavedude-core", default-features = false, features = ["gpu"] }
wavedude-view = { path = "../wavedude-view" }
js-sys = "0.3"
thiserror.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
	"CanvasRenderingContext2d",
	"CssStyleDeclaration",
	"Document",
	"Element",
	"HtmlCanvasElement",
	"HtmlElement",
	"ImageData",
	"Node",
	"TextMetrics",
	"Window",
] }

[dev-dependencies]
# A native run is the reference the session's probe traces are checked against.
wavedude-core = { path = "../wavedude-core", features = ["run"] }
wavedude-examples = { path = "../wavedude-examples" }
pollster = "1"
