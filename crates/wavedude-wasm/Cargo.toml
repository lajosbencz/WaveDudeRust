[package]
name = "wavedude-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The WaveDude engine for the browser: open a project, step to a frame, render its layers"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
wavedude-core = { path = "../wavedude-core", default-features = false, features = ["gpu"] }
js-sys = "0.3"
thiserror.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wavedude-examples = { path = "../wavedude-examples" }
pollster = "1"
