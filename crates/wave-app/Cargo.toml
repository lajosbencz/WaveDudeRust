[package]
name = "wave-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WaveDude desktop application (Freya)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wave-app"
path = "src/main.rs"

[dependencies]
freya = { version = "0.5", features = ["engine", "markdown"] }
wave-widgets = { path = "../wave-widgets" }
wave-export = { path = "../wave-export" }
wave-app-state = { path = "../wave-app-state" }
bytes = "1"
rfd = "0.15"
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing.workspace = true
wave-core = { path = "../wave-core", features = ["gpu"] }

[dev-dependencies]
freya-testing = "0.5"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
