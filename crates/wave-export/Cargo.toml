[package]
name = "wave-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Image, video, OpenEXR and CSV export sinks and the export job"

[features]
default = ["mp4"]
mp4 = ["dep:openh264", "dep:mp4"]
clap = ["dep:clap"]

[dependencies]
wave-core = { path = "../wave-core", default-features = false }
anyhow.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true
tracing.workspace = true
png.workspace = true
clap = { workspace = true, optional = true }
jpeg-encoder = "0.7"
exr = "1.74"
ab_glyph = "0.2"
openh264 = { version = "0.9", optional = true }
mp4 = { version = "0.14", optional = true }

[dev-dependencies]
insta.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
