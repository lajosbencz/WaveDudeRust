[package]
name = "wavedude-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["wave", "simulation", "physics", "optics"]
categories = ["science", "simulation"]
description = "Model, scene painter, wave engines (CPU and wgpu), frame store, probes, renderer"
# Not on crates.io: the workspace is built and released as one.
publish = false

[features]
default = ["gpu", "run"]
gpu = ["dep:wgpu", "dep:pollster"]
# Runs and the frame store: threads, a disk spill and the machine's memory. Without it (and `gpu`) the crate
# builds for wasm32-unknown-unknown.
run = ["dep:sysinfo", "dep:tempfile"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
wavedude-model-derive = { path = "../wavedude-model-derive" }
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
json5 = "1.3"
base64 = "0.23"
num-complex = { version = "0.4", default-features = false, features = ["std"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }
tempfile = { version = "3", optional = true }
web-time = "1.1"
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
approx = "0.5"
tempfile = "3"
