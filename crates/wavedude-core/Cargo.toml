[package]
name = "wavedude-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["wave", "simulation", "physics", "optics"]
categories = ["science", "simulation"]
description = "Model, scene painter, wave engines (CPU and wgpu), frame store, probes, renderer"
# Not on crates.io: the workspace is built and released as one.
publish = false

[features]
default = ["gpu", "run"]
gpu = ["dep:wgpu", "dep:pollster"]
# Runs and the frame store. Natively a threaded or pumped worker, a disk spill and the machine's memory; on wasm32 a
# pumped worker and a store in memory.
run = ["dep:sysinfo", "dep:tempfile"]
# Serde for a run's goal and the project it carries; a scene's image bytes are left out.
serde = ["dep:serde"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
wavedude-model-derive = { path = "../wavedude-model-derive", version = "0.3.1" }
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
quick-xml.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
json5 = "1.3"
base64 = "0.23"
num-complex = { version = "0.4", default-features = false, features = ["std"] }
web-time = "1.1"
wgpu = { version = "30", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true, optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
approx = "0.5"
postcard.workspace = true
tempfile = "3"
