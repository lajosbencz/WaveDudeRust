[package]
name = "wavedude-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["wave", "simulation", "physics", "optics"]
categories = ["science", "simulation"]
description = "Image, video, OpenEXR and CSV export sinks and the export job"
# Not on crates.io: the workspace is built and released as one.
publish = false

[features]
default = ["mp4"]
# MP4 through Cisco's prebuilt OpenH264, downloaded by the user's choice and loaded at run time (decision 0005).
mp4 = ["dep:openh264", "openh264/libloading", "dep:mp4", "dep:ureq", "dep:bzip2"]
# OpenH264 compiled into the program instead: for development and tests, not for distributed builds.
openh264-source = ["mp4", "openh264/source"]
clap = ["dep:clap"]

[lints]
workspace = true

[dependencies]
wavedude-core = { path = "../wavedude-core", version = "0.2.2", default-features = false, features = ["run"] }
anyhow.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true
tracing.workspace = true
png.workspace = true
clap = { workspace = true, optional = true }
jpeg-encoder = "0.7"
exr = "1.74"
ab_glyph = "0.2"
openh264 = { version = "0.9", default-features = false, optional = true }
ureq = { version = "3", optional = true }
bzip2 = { version = "0.6", optional = true }
mp4 = { version = "0.14", optional = true }

[dev-dependencies]
insta.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
