[package]
name = "wavedude-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "A 2D wave simulator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wavedude-app"
path = "src/main.rs"

[features]
# OpenH264 compiled in instead of Cisco's downloaded binary: for development and tests, not for distributed builds.
openh264-source = ["wavedude-export/openh264-source"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# The presenter's pictures, whose buffers it draws into again once the textures took them.
bytes = "1"
# The window, its widgets and the wgpu renderer whose device the engines share (natively and in the browser).
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wayland", "wgpu", "x11"] }
# The manual and the license texts as Markdown.
egui_commonmark = { version = "=0.26.0", default-features = false, features = ["pulldown_cmark"] }
# The image loader of the bundled PNGs (the manual's figures, the About icon); eframe enables `image`'s PNG decoder.
egui_extras = { version = "=0.37.0", default-features = false, features = ["image"] }
# The menus' icons.
egui_material_icons = { version = "=0.9.0", default-features = false, features = ["outline"] }
# The dock of panes around the Preview; its arrangement saves as JSON in the settings.
egui_tiles = "=0.18.0"
# The drawn icons' SVG path data, flattened for epaint (epaint's own dependency).
kurbo = "0.13"
# The Markdown's code blocks and figure tags, cut out of what egui_commonmark draws.
pulldown-cmark = { version = "0.13", default-features = false }
# The Messages pane's search as a regular expression.
regex = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
wavedude-app-state = { path = "../wavedude-app-state" }
wavedude-core = { path = "../wavedude-core", features = ["gpu"] }
wavedude-examples = { path = "../wavedude-examples" }
# The bundled fonts and what the preview draws over its pictures.
wavedude-view = { path = "../wavedude-view" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Reads the clipboard for Paste's enabled state and its menu entry; egui reads it only for its paste key.
arboard = { version = "3.6", default-features = false }
cargo-packager-updater = "0.2"
mundy = { version = "0.2.3", default-features = false, features = ["async-io", "callback", "color-scheme"] }
# Waits on the file dialogs' futures on their own threads.
pollster = "1"
rfd = "0.18"
semver = "1"
wavedude-export = { path = "../wavedude-export" }
# The window's place and the event loop the macOS application delegate is set on.
winit = { version = "0.30", default-features = false }

# The page's entry awaits eframe's start; the page itself is reached through eframe's `web_sys`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# The Finder's open requests (src/open_requests.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

# The executable's icon and names in Explorer (build.rs); cargo-packager does not embed them.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# The window driven headless on wgpu, through AccessKit.
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu"] }
# Crops the rendered window into the manual's figures (tests/screenshots.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

# Installers (decision 0011) of the built programs:
# `cargo build --release -p wavedude-app -p wavedude-cli && cargo packager --release -p wavedude-app --formats <format>`.
[package.metadata.packager]
product-name = "WaveDude Rust"
identifier = "io.github.lajosbencz.wavedude-rust"
category = "Education"
authors = ["Lajos Bencz"]
publisher = "Lajos Bencz"
homepage = "https://github.com/lajosbencz/WaveDudeRust"
copyright = "Copyright (C) 2026 Lajos Bencz"
license-file = "../../LICENSE.md"
icons = ["assets/icons/*"]
out-dir = "../../target/packages"
binaries = [{ path = "wavedude-app", main = true }, { path = "wavedude-cli" }]
# `name` is the Windows ProgId (no spaces); macOS takes its document types from assets/macos/Info.plist.
file-associations = [
	{ extensions = ["wdproj"], mime-type = "application/x-wavedude-project+xml", description = "WaveDude project", name = "WaveDudeRust.Project", role = "editor" },
	{ extensions = ["wdscheme"], mime-type = "application/x-wavedude-scheme+xml", description = "WaveDude colour scheme", name = "WaveDudeRust.ColorScheme", role = "editor" },
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
# The stock template with the file associations opt-in.
template = "assets/windows/installer.nsi"

# Ad-hoc signature: an unsigned bundle on Apple silicon is reported as damaged instead of unverified.
[package.metadata.packager.macos]
signing-identity = "-"
# Merged over cargo-packager's: the exported types and the document types that name them.
info-plist-path = "assets/macos/Info.plist"

# The MIME types the .desktop file names, for desktop integration of the AppImage.
[package.metadata.packager.appimage]
files = { "assets/linux/wavedude-rust.xml" = "usr/share/mime/packages/wavedude-rust.xml" }
# winit dlopens these X11 client libraries, so linuxdeploy cannot find them; the GPU stack (Vulkan, EGL, GL) stays the host's.
libs = ["libxkbcommon.so.0", "libxkbcommon-x11.so.0", "libxcb-xkb.so.1", "libXcursor.so.1", "libXi.so.6", "libXrandr.so.2"]
