[package]
name = "wavedude-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "A 2D wave simulator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wavedude-app"
path = "src/main.rs"

[features]
# OpenH264 compiled in instead of Cisco's downloaded binary: for development and tests, not for distributed builds.
openh264-source = ["wavedude-export/openh264-source"]

[lints]
workspace = true

[dependencies]
cargo-packager-updater = "0.2"
semver = "1"
freya = { version = "0.5", features = ["engine", "markdown"] }
freya-winit = "0.5"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
wavedude-widgets = { path = "../wavedude-widgets" }
wavedude-export = { path = "../wavedude-export" }
wavedude-app-state = { path = "../wavedude-app-state" }
bytes = "1"
mundy = { version = "0.2.3", default-features = false, features = ["async-io", "callback", "color-scheme"] }
rfd = "0.17"
anyhow.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing.workspace = true
wavedude-core = { path = "../wavedude-core", features = ["gpu"] }

# The Finder's open requests (src/ui/open_requests.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

# The executable's icon and names in Explorer (build.rs); cargo-packager does not embed them.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
freya-testing = "0.5"
wavedude-testing = { path = "../wavedude-testing" }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Installers (decision 0011) of the built programs:
# `cargo build --release -p wavedude-app -p wavedude-cli && cargo packager --release -p wavedude-app --formats <format>`.
[package.metadata.packager]
product-name = "WaveDude Rust"
identifier = "io.github.lajosbencz.wavedude-rust"
category = "Education"
authors = ["Lajos Bencz"]
publisher = "Lajos Bencz"
homepage = "https://github.com/lajosbencz/WaveDudeRust"
copyright = "Copyright (C) 2026 Lajos Bencz"
license-file = "../../LICENSE.md"
icons = ["assets/icons/*"]
out-dir = "../../target/packages"
binaries = [{ path = "wavedude-app", main = true }, { path = "wavedude-cli" }]
# `name` is the Windows ProgId (no spaces); macOS takes its document types from assets/macos/Info.plist.
file-associations = [
	{ extensions = ["wdproj"], mime-type = "application/x-wavedude-project+xml", description = "WaveDude project", name = "WaveDudeRust.Project", role = "editor" },
	{ extensions = ["wdscheme"], mime-type = "application/x-wavedude-scheme+xml", description = "WaveDude colour scheme", name = "WaveDudeRust.ColorScheme", role = "editor" },
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
# The stock template with the file associations opt-in.
template = "assets/windows/installer.nsi"

# Ad-hoc signature: an unsigned bundle on Apple silicon is reported as damaged instead of unverified.
[package.metadata.packager.macos]
signing-identity = "-"
# Merged over cargo-packager's: the exported types and the document types that name them.
info-plist-path = "assets/macos/Info.plist"

# The MIME types the .desktop file names, for desktop integration of the AppImage.
[package.metadata.packager.appimage]
files = { "assets/linux/wavedude-rust.xml" = "usr/share/mime/packages/wavedude-rust.xml" }
