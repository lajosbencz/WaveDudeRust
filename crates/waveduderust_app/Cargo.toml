[package]
name = "waveduderust_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude Rust without a UI toolkit: document, history, selection, commands, live runs, settings, strings, log, menus, forms, preview models, exports, dialogs, the updater"

[features]
# `live::fake`, the scripted run backend, for the integration tests (enabled by the dev-dependency on this crate).
test-support = []

[lints]
workspace = true

[dependencies]
waveduderust = { path = "../waveduderust", default-features = false, features = ["unstable-engine", "unstable-export", "unstable-reflect", "unstable-run", "unstable-scene", "gpu", "run", "serde", "export"] }
waveduderust_examples = { path = "../waveduderust_examples" }
anyhow.workspace = true
# The presenter's pictures, whose buffers it draws into again once the textures took them.
bytes = "1"
postcard.workspace = true
# The Messages pane's search as a regular expression.
regex = "1"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cargo-packager-updater = "0.2"
directories = "6"
notify = "8"
opener = { version = "0.9", features = ["reveal"] }
# Cisco's OpenH264 download: the same client and TLS the updater brings, and its archive format.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
bzip2 = "0.6"
semver = "1"
# An export's archive is written under a temporary name beside it, its videos spooled in a temporary folder there.
tempfile.workspace = true
tracing-appender = "0.2"
# MP4 natively alone.
waveduderust = { path = "../waveduderust", default-features = false, features = ["mp4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
# MP4 muxed around the browser's H.264 encoder.
waveduderust = { path = "../waveduderust", default-features = false, features = ["mp4-mux"] }
web-sys = { workspace = true, features = [
	"Blob",
	"CodecState",
	"DedicatedWorkerGlobalScope",
	"Document",
	"Element",
	"EncodedVideoChunk",
	"EncodedVideoChunkType",
	"ErrorEvent",
	"Event",
	"File",
	"FileList",
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetDirectoryOptions",
	"FileSystemGetFileOptions",
	"FileSystemRemoveOptions",
	"FileSystemWritableFileStream",
	"HardwareAcceleration",
	"HtmlAnchorElement",
	"HtmlElement",
	"HtmlInputElement",
	"LatencyMode",
	"Lock",
	"LockManager",
	"LockOptions",
	"MediaQueryList",
	"MessageEvent",
	"Navigator",
	"Storage",
	"StorageManager",
	"Url",
	"VideoColorPrimaries",
	"VideoColorSpaceInit",
	"VideoEncoder",
	"VideoEncoderBitrateMode",
	"VideoEncoderConfig",
	"VideoEncoderEncodeOptions",
	"VideoEncoderInit",
	"VideoEncoderSupport",
	"VideoFrame",
	"VideoFrameBufferInit",
	"VideoMatrixCoefficients",
	"VideoPixelFormat",
	"VideoTransferCharacteristics",
	"Window",
	"Worker",
	"WorkerOptions",
	"WorkerType",
	"WritableStream",
	"WriteCommandType",
	"WriteParams",
] }

# The Finder's open requests (src/open_requests.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[dev-dependencies]
waveduderust_app = { path = ".", features = ["test-support"] }
png.workspace = true
tempfile.workspace = true
# Loses a GPU device in the run worker's tests; the version core's `gpu` feature builds on.
wgpu.workspace = true
