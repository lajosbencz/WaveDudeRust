[package]
name = "waveduderust_remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude Rust's live run in another agent: the protocol between the page and the browser's run worker, and both its ends; the page's end of the browser's spill worker"

[lints]
workspace = true

[features]
# The exports' files in the session folder (`opfs::Spool`), written by the page.
spool = ["waveduderust/unstable-export"]

[dependencies]
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
waveduderust = { path = "../waveduderust", default-features = false, features = ["run", "serde", "unstable-engine", "unstable-run", "unstable-scene", "unstable-sync"] }
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
	"DedicatedWorkerGlobalScope",
	"ErrorEvent",
	"Blob",
	"Event",
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetDirectoryOptions",
	"FileSystemGetFileOptions",
	"FileSystemRemoveOptions",
	"FileSystemWritableFileStream",
	"Lock",
	"LockManager",
	"LockOptions",
	"MessageEvent",
	"Navigator",
	"StorageManager",
	"Window",
	"Worker",
	"WorkerOptions",
	"WorkerType",
	"WriteCommandType",
	"WriteParams",
] }
