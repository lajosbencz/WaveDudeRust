[package]
name = "wavedude-app-state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WaveDude application state without a UI toolkit: document, history, selection, commands, live runs, settings, strings, log"

[lib]
name = "wavedude_app_state"

[features]
# `live::fake`, the scripted run backend, for the integration tests (enabled by the dev-dependency on this crate).
test-support = []

[lints]
workspace = true

[dependencies]
wavedude-core = { path = "../wavedude-core", features = ["gpu", "serde"] }
wavedude-examples = { path = "../wavedude-examples" }
wavedude-export = { path = "../wavedude-export", default-features = false, features = ["serde"] }
anyhow.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
notify = "8"
opener = "0.9"
tracing-appender = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
wavedude-spill-worker = { path = "../wavedude-spill-worker" }
web-sys = { workspace = true, features = [
	"Blob",
	"CodecState",
	"DedicatedWorkerGlobalScope",
	"Document",
	"Element",
	"EncodedVideoChunk",
	"EncodedVideoChunkType",
	"ErrorEvent",
	"Event",
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetDirectoryOptions",
	"FileSystemGetFileOptions",
	"FileSystemRemoveOptions",
	"FileSystemWritableFileStream",
	"HardwareAcceleration",
	"HtmlAnchorElement",
	"HtmlElement",
	"LatencyMode",
	"Lock",
	"LockManager",
	"LockOptions",
	"MediaQueryList",
	"MessageEvent",
	"Navigator",
	"Storage",
	"StorageEstimate",
	"StorageManager",
	"Url",
	"VideoColorPrimaries",
	"VideoColorSpaceInit",
	"VideoEncoder",
	"VideoEncoderBitrateMode",
	"VideoEncoderConfig",
	"VideoEncoderEncodeOptions",
	"VideoEncoderInit",
	"VideoEncoderSupport",
	"VideoFrame",
	"VideoFrameBufferInit",
	"VideoMatrixCoefficients",
	"VideoPixelFormat",
	"VideoTransferCharacteristics",
	"Window",
	"Worker",
	"WorkerOptions",
	"WorkerType",
	"WritableStream",
	"WriteCommandType",
	"WriteParams",
] }

[dev-dependencies]
wavedude-app-state = { path = ".", features = ["test-support"] }
png.workspace = true
tempfile.workspace = true
# Loses a GPU device in the run worker's tests; the version core's `gpu` feature builds on.
wgpu.workspace = true
