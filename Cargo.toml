[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lajosbencz/WaveDudeRust"
rust-version = "1.89"

# The lint policy of every crate (`[lints] workspace = true`); CI runs clippy with `-D warnings`, so each of these
# fails the build. The cast lints and `missing_docs` are left out on purpose: casts are handled by the unit types,
# and comments state only what the code cannot say.
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
implicit_clone = "deny"
explicit_iter_loop = "deny"
ignored_unit_patterns = "deny"
if_not_else = "deny"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
half = { version = "2.7", features = ["bytemuck", "num-traits"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"
wide = "0.7"
rand_pcg = "0.9"
rand_core = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
quick-xml = { version = "0.42", features = ["serialize"] }
tracing = "0.1"
notify = "8"
insta = "1"
proptest = "1"
png = "0.18"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The engines, painter and renderer are too slow unoptimised for the tests that run them (the CLI's gate
# demonstrations took over 15 minutes); set 0 locally to step through them.
[profile.dev.package.wavedude-core]
opt-level = 2
