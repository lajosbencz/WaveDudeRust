[workspace]
resolver = "3"
members = ["crates/*", "frontends/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lajosbencz/WaveDudeRust"
rust-version = "1.100"

# The lint policy of every crate (`[lints] workspace = true`); CI runs clippy with `-D warnings`, so each of these
# fails the build. The cast lints and `missing_docs` are left out on purpose: casts are handled by the unit types,
# and comments state only what the code cannot say.
[workspace.lints.rust]
# deny, not forbid: a crate may allow it where it must
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
implicit_clone = "deny"
explicit_iter_loop = "deny"
ignored_unit_patterns = "deny"
if_not_else = "deny"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
half = { version = "2.7", features = ["bytemuck", "num-traits"] }
image = { version = "0.25", default-features = false }
insta = "1"
png = "0.18"
pollster = "1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rayon = "1.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1.0.131", features = ["float_roundtrip"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
web-sys = "0.3"
web-time = "1.1"
wgpu = "30"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The engines, painter and renderer are too slow unoptimised for the tests that run them (the CLI's gate
# demonstrations took over 15 minutes); set 0 locally to step through them.
[profile.dev.package.waveduderust]
opt-level = 2
