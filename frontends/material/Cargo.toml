[package]
name = "waveduderust_material"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "A 2D wave simulator, with a Material Design window on egui-mineral (experimental)"

[[bin]]
name = "wavedude-mineral"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
waveduderust_icon_subset = { path = "../../crates/waveduderust_icon_subset" }

[dependencies]
anyhow.workspace = true
# The window and the wgpu renderer, whose device the engines share natively.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wayland", "wgpu", "x11"] }
# The About page's icon.
egui_extras = { version = "=0.37.0", default-features = false, features = ["image"] }
# The UI runtime: routes, shortcuts, the command bus, toasts.
egui_mineral = { version = "0.12.0", default-features = false, features = ["icu", "platform-pickers"] }
# Material Design 3 components and theme on egui-mineral.
egui_mineral_material = { version = "0.12.0", default-features = false, features = ["extras", "icu"] }
# The licence text, rendered.
egui_commonmark = { version = "=0.26.0", default-features = false, features = ["pulldown_cmark"] }
tracing.workspace = true
waveduderust_app = { path = "../../crates/waveduderust_app" }
waveduderust = { path = "../../crates/waveduderust", default-features = false, features = ["unstable-engine", "unstable-export", "unstable-reflect", "unstable-run", "unstable-scene", "gpu", "run", "export"] }
waveduderust_egui_platform = { path = "../../crates/waveduderust_egui_platform" }
waveduderust_egui_preview = { path = "../../crates/waveduderust_egui_preview" }
waveduderust_examples = { path = "../../crates/waveduderust_examples" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The start-up failure's message box.
rfd = "0.18"

# The page's entry awaits eframe's start.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
