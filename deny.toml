# cargo deny: advisories, licences, duplicate versions and sources, run by CI (`cargo deny check`).

[graph]
all-features = true

[advisories]
# Unmaintained transitive crates are the upstream's to replace; our own dependencies are held to it.
unmaintained = "workspace"
ignore = []

[licenses]
# Every licence in the tree, all compatible with the GPL-3.0-or-later of this work.
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"GPL-3.0-or-later",
	"IJG",
	"ISC",
	"LGPL-2.1-or-later",
	"MIT",
	"MIT-0",
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
	"bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
