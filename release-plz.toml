# Releases (decision 0011): one version for the workspace (version.workspace). The app's GitHub release (tag
# v<version>, a draft until the installers are attached) carries the programs. crates.io publishing of
# wavedude-core and wavedude-export is off until wanted: replace their `release = false` with
# `version_group = "wavedude"` and see docs/release.md.
[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = false
semver_check = false

[[package]]
name = "wavedude-core"
release = false

[[package]]
name = "wavedude-export"
release = false

[[package]]
name = "wavedude-app"
git_only = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["wavedude-core", "wavedude-export", "wavedude-widgets", "wavedude-app-state", "wavedude-cli"]

[[package]]
name = "wavedude-widgets"
release = false

[[package]]
name = "wavedude-app-state"
release = false

[[package]]
name = "wavedude-cli"
release = false
